<form class="search-form catalog-form" method="get">
  <input type="hidden" name="view" value="{{ filters.view }}">
  <div class="field catalog-text"><label for="catalog-q">Поиск по предмету, имени или группе</label><input id="catalog-q" type="search" name="q" maxlength="100" value="{{ filters.q }}" placeholder="Например, математика"></div>
  <div class="field"><label for="study-date">Дата занятия</label><input id="study-date" type="date" name="date" value="{{ filters.date }}"></div>
  <div class="field"><label for="subject">Предмет</label><select id="subject" name="subject"><option value="">Все предметы</option>{% for subject in subjects %}<option value="{{ subject.id }}" {% if filters.subject == subject.id|stringformat:'s' %}selected{% endif %}>{{ subject.name }}</option>{% endfor %}</select></div>
  <div class="field"><label for="format">Формат занятий</label><select id="format" name="format"><option value="">Все форматы</option>{% for value in formats %}<option value="{{ value }}" {% if filters.format == value %}selected{% endif %}>{{ value|capfirst }}</option>{% endfor %}</select></div>
  <div class="field"><label for="status">Статус</label><select id="status" name="status"><option value="all" {% if filters.status == 'all' %}selected{% endif %}>Все запросы</option>{% for code,label in status_choices %}<option value="{{ code }}" {% if filters.status == code %}selected{% endif %}>{{ label }}</option>{% endfor %}<option value="closed" {% if filters.status == 'closed' %}selected{% endif %}>Все закрытые</option></select></div>
  <div class="field"><label for="author">Автор запроса</label><select id="author" name="user"><option value="">Все участники</option>{% for user in users %}<option value="{{ user.id }}" {% if filters.user == user.id|stringformat:'s' %}selected{% endif %}>{{ user.name }}</option>{% endfor %}</select></div>
  <div class="field"><label for="sort">Сортировка</label><select id="sort" name="sort">{% for value,label in sort_options %}<option value="{{ value }}" {% if filters.sort == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  <div class="field"><label for="per-page">Запросов на странице</label><select id="per-page" name="per_page">{% for value in page_sizes %}<option value="{{ value }}" {% if filters.per_page == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div>
  <div class="search-actions catalog-actions"><button class="button button-primary" type="submit">Найти запросы ↗</button><a class="text-link" href="{% if is_search %}{% url 'requests:search' %}{% else %}{% url 'requests:list' %}{% endif %}">Сбросить</a></div>
</form>
